<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — CampusFind</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🔍</div>
                <span>CampusFind</span>
            </a>
            <div class="nav-actions">
                <a href="/login.html" class="btn btn-outline btn-sm">Back to Login</a>
            </div>
        </div>
    </header>

    <!-- Forgot Password Form -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Reset Your Password</h2>
                <p>Enter your registered college email address to receive secure reset instructions.</p>
            </div>

            <div id="forgot-alert" class="error-text" style="background:#FEE2E2; border:1px solid #FECACA; padding:12px; border-radius:var(--radius-md); margin-bottom:20px; text-align:center;"></div>

            <div id="dev-box" style="display:none; background:#EDE9FE; border:1px solid #DDD6FE; padding:16px; border-radius:var(--radius-md); margin-bottom:20px; font-size:0.9rem; color:#4C1D95;">
                <strong>🛠️ Local Development Reset Link:</strong><br>
                <span style="font-size:0.82rem; color:#6D28D9; word-break:break-all;" id="dev-link-text"></span>
                <div style="margin-top:10px;">
                    <a id="dev-link-btn" href="#" class="btn btn-primary btn-sm">Click to Reset Password</a>
                </div>
            </div>

            <form id="forgot-form">
                <div class="form-group">
                    <label class="form-label" for="email">Campus Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="student@campusfind.edu" required autocomplete="email">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:14px; font-size:1rem; margin-top:10px;">
                    Send Password Reset Link
                </button>
            </form>

            <div style="text-align:center; margin-top:24px; font-size:0.92rem; color:var(--text-muted);">
                Remembered your password? <a href="/login.html" style="font-weight:700;">Return to login</a>
            </div>
        </div>
    </main>

    <script src="/js/env.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const alertBox = document.getElementById('forgot-alert');
            const devBox = document.getElementById('dev-box');
            const submitBtn = document.getElementById('submit-btn');

            alertBox.classList.remove('visible');
            devBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating Token...';

            try {
                const res = await api.post('/api/auth/forgot-password', { email });
                if (res && res.success) {
                    api.showToast(res.message, 'success');

                    // If dev reset link is returned in local-dev mode
                    if (res.data && res.data.devResetUrl) {
                        document.getElementById('dev-link-text').textContent = res.data.devResetUrl;
                        document.getElementById('dev-link-btn').href = res.data.devResetUrl;
                        devBox.style.display = 'block';
                    }

                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Link Sent!';
                } else {
                    throw new Error(res.message || 'Failed to request reset');
                }
            } catch (err) {
                alertBox.textContent = err.message || 'Error requesting password reset';
                alertBox.classList.add('visible');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Password Reset Link';
            }
        });
    </script>
</body>
</html>
