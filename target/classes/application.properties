# ==============================================================================
# CampusFind Application Configuration — Deployment & Cloud Ready
# ==============================================================================

# Server Port (Render passes dynamic PORT variable, default 8080 for local dev)
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=always
server.error.include-binding-errors=always

spring.application.name=campusfind

# ------------------------------------------------------------------------------
# MySQL Database Connection (via Spring JdbcTemplate & HikariCP)
# Supports Cloud MySQL (Aiven, TiDB Cloud, Railway, etc.) via DB_URL, DB_USERNAME, DB_PASSWORD
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusfind_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sanket#7709}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CampusFindHikariPool

# ------------------------------------------------------------------------------
# SQL Initialization (Runs schema automatically on startup if tables not present)
# ------------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ------------------------------------------------------------------------------
# CORS Configuration (Allows Vercel frontend, local live servers, and dev ports)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:3000}

# ------------------------------------------------------------------------------
# File Upload Settings (Enforcing 5MB limit and secure local storage)
# ------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ------------------------------------------------------------------------------
# Email Service Configuration (Optional / Local Dev Fallback)
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}

# When email is disabled, reset token is outputted to server console & API response for dev testing
app.dev-mode.log-reset-tokens=true
