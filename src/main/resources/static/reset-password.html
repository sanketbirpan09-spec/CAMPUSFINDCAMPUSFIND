<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — CampusFind</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🔍</div>
                <span>CampusFind</span>
            </a>
            <div class="nav-actions">
                <a href="/login.html" class="btn btn-outline btn-sm">Log In</a>
            </div>
        </div>
    </header>

    <!-- Reset Password Form -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Choose a New Password</h2>
                <p>Enter your new password below to secure your CampusFind account.</p>
            </div>

            <div id="reset-alert" class="error-text" style="background:#FEE2E2; border:1px solid #FECACA; padding:12px; border-radius:var(--radius-md); margin-bottom:20px; text-align:center;"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label" for="token">Reset Token</label>
                    <input type="text" id="token" class="form-control" placeholder="32-character token" required>
                    <span class="form-help">Auto-filled from your reset link, or paste from console</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="new-password">New Password</label>
                    <input type="password" id="new-password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Repeat new password" required minlength="6">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:14px; font-size:1rem; margin-top:10px;">
                    Update Password &amp; Log In
                </button>
            </form>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (token) {
                document.getElementById('token').value = token;
            }
        });

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertBox = document.getElementById('reset-alert');
            const submitBtn = document.getElementById('submit-btn');

            alertBox.classList.remove('visible');

            if (newPassword !== confirmPassword) {
                alertBox.textContent = 'Passwords do not match.';
                alertBox.classList.add('visible');
                return;
            }

            if (newPassword.length < 6) {
                alertBox.textContent = 'Password must be at least 6 characters.';
                alertBox.classList.add('visible');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating Password...';

            try {
                const res = await api.post('/api/auth/reset-password', {
                    token,
                    newPassword,
                    confirmPassword
                });

                if (res && res.success) {
                    api.showToast('Password updated successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1200);
                } else {
                    throw new Error(res.message || 'Password reset failed');
                }
            } catch (err) {
                alertBox.textContent = err.message || 'Invalid or expired token.';
                alertBox.classList.add('visible');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password & Log In';
            }
        });
    </script>
</body>
</html>
