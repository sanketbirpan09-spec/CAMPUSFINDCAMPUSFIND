<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports — CampusFind</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🔍</div>
                <span>CampusFind</span>
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/my-reports.html" class="nav-link active">My Reports</a></li>
            </ul>
            <div class="nav-actions" id="nav-auth-actions"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container" style="padding: 40px 20px 80px;">
        <div class="section-header">
            <div>
                <span class="hero-pill">Account Activity</span>
                <h1 style="font-size: 2rem; margin-top: 6px;">My Submitted Reports</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Manage and update the status of items you have reported</p>
            </div>
            <a href="/report-item.html" class="btn btn-primary">
                <span>+</span> Post New Report
            </a>
        </div>

        <div id="reports-container">
            <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
                Loading your reports...
            </div>
        </div>
    </main>

    <!-- Details Modal -->
    <div class="modal-overlay" id="details-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Item Details</h3>
                <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await api.getCurrentUser();
            if (!user) {
                window.location.href = '/login.html?redirect=/my-reports.html';
                return;
            }
            loadUserReports();
        });

        async function loadUserReports() {
            const container = document.getElementById('reports-container');

            try {
                const res = await api.get('/api/items/my-reports');
                if (res && res.success) {
                    const reports = res.data || [];

                    if (reports.length === 0) {
                        container.innerHTML = `
                            <div style="text-align:center; padding: 60px 20px; background: white; border-radius: var(--radius-xl); border: 1px dashed var(--lavender-border);">
                                <div style="font-size: 3rem; margin-bottom: 12px;">📋</div>
                                <h3 style="margin-bottom: 8px;">No reports filed yet</h3>
                                <p style="color: var(--text-muted); max-width: 400px; margin: 0 auto 20px;">You haven't posted any lost or found items under this account.</p>
                                <a href="/report-item.html" class="btn btn-primary">File a Report</a>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = `
                        <div class="items-grid">
                            ${reports.map(renderMyReportCard).join('')}
                        </div>
                    `;
                }
            } catch (err) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #EF4444;">
                        Failed to retrieve your reports.
                    </div>
                `;
            }
        }

        function renderMyReportCard(item) {
            const isLost = item.type === 'LOST';
            const isResolved = item.status === 'RESOLVED';

            let badgeClass = isLost ? 'badge-lost' : 'badge-found';
            let badgeText = isLost ? 'Lost Item' : 'Found Item';

            if (isResolved) {
                badgeClass = 'badge-resolved';
                badgeText = 'Resolved';
            }

            const fullImgUrl = (window.CAMPUSFIND_CONFIG && typeof window.CAMPUSFIND_CONFIG.resolveAssetUrl === 'function')
                ? window.CAMPUSFIND_CONFIG.resolveAssetUrl(item.imageUrl)
                : item.imageUrl;

            const imageHtml = fullImgUrl
                ? `<img src="${fullImgUrl}" alt="${escapeHtml(item.title)}" class="item-image">`
                : `
                    <div class="item-image-placeholder">
                        <span>📦 ${escapeHtml(item.category)}</span>
                    </div>
                `;

            return `
                <article class="item-card">
                    <div class="item-image-wrapper">
                        <span class="badge ${badgeClass} item-badge-top">${badgeText}</span>
                        <span class="badge-category">${escapeHtml(item.category)}</span>
                        ${imageHtml}
                    </div>
                    <div class="item-card-body">
                        <h3 class="item-card-title">${escapeHtml(item.title)}</h3>
                        <p class="item-card-desc">${escapeHtml(item.description)}</p>
                        <div class="item-meta">
                            <div class="item-meta-row">
                                <span>📍</span>
                                <span>${escapeHtml(item.location)}</span>
                            </div>
                            <div class="item-meta-row">
                                <span>📅</span>
                                <span>Date: ${escapeHtml(item.itemDate)}</span>
                            </div>
                        </div>
                        <div class="item-card-footer">
                            ${!isResolved ? `
                                <button class="btn btn-primary btn-sm" onclick="markItemResolved(${item.id})">
                                    ✓ Mark as Resolved
                                </button>
                            ` : `
                                <span style="font-size:0.85rem; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:4px;">
                                    ✓ Closed & Reunited
                                </span>
                            `}
                            <button class="btn btn-secondary btn-sm" onclick="viewReportDetails(${item.id})">
                                Details
                            </button>
                        </div>
                    </div>
                </article>
            `;
        }

        async function markItemResolved(itemId) {
            if (!confirm('Are you sure you want to mark this item as resolved? It will be marked as reunited for the campus community.')) {
                return;
            }

            try {
                const res = await api.put(`/api/items/${itemId}/resolve`, {});
                if (res && res.success) {
                    api.showToast('Item successfully marked as resolved!', 'success');
                    loadUserReports();
                } else {
                    throw new Error(res.message || 'Failed to update report');
                }
            } catch (err) {
                api.showToast(err.message || 'Error resolving report', 'error');
            }
        }

        async function viewReportDetails(itemId) {
            const modal = document.getElementById('details-modal');
            const modalBody = document.getElementById('modal-body');
            const modalTitle = document.getElementById('modal-title');
            if (!modal) return;

            modalBody.innerHTML = '<p style="text-align:center; padding:20px;">Loading...</p>';
            modal.classList.add('active');

            try {
                const res = await api.get(`/api/items/${itemId}`);
                if (res && res.success && res.data) {
                    const item = res.data;
                    modalTitle.textContent = item.title;
                    modalBody.innerHTML = `
                        ${item.imageUrl ? `<div style="margin-bottom:16px; border-radius:var(--radius-md); overflow:hidden;"><img src="${item.imageUrl}" style="width:100%; max-height:260px; object-fit:cover;"></div>` : ''}
                        <p style="margin-bottom:12px; font-size:1rem; color:var(--text-main);">${escapeHtml(item.description)}</p>
                        <div style="background:var(--lavender-subtle); padding:16px; border-radius:var(--radius-md); font-size:0.9rem;">
                            <p><strong>Type:</strong> ${escapeHtml(item.type)}</p>
                            <p><strong>Status:</strong> ${escapeHtml(item.status)}</p>
                            <p><strong>Location:</strong> ${escapeHtml(item.location)}</p>
                            <p><strong>Contact:</strong> ${escapeHtml(item.contactInfo)}</p>
                            <p><strong>Reported:</strong> ${escapeHtml(item.itemDate)}</p>
                        </div>
                    `;
                }
            } catch (err) {
                modalBody.innerHTML = '<p style="color:#EF4444; padding:20px;">Could not load details.</p>';
            }
        }

        function closeDetailsModal() {
            const modal = document.getElementById('details-modal');
            if (modal) modal.classList.remove('active');
        }
    </script>
</body>
</html>
