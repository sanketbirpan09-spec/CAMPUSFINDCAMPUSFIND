services:
  - type: web
    name: campusfind-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/items/stats
    envVars:
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false # Set in Render Dashboard: jdbc:mysql://<host>:<port>/<dbname>?useSSL=true&serverTimezone=UTC
      - key: DB_USERNAME
        sync: false # Set in Render Dashboard
      - key: DB_PASSWORD
        sync: false # Set in Render Dashboard
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:3000,http://localhost:5500
      - key: MAIL_ENABLED
        value: false
