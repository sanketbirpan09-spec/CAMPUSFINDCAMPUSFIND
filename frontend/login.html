<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — CampusFind</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="brand-logo">
                <div class="brand-icon">🔍</div>
                <span>CampusFind</span>
            </a>
            <div class="nav-actions">
                <a href="/register.html" class="btn btn-outline btn-sm">Create Account</a>
            </div>
        </div>
    </header>

    <!-- Login Container -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in with your college credentials to manage reports</p>
            </div>

            <div id="login-alert" class="error-text" style="background:#FEE2E2; border:1px solid #FECACA; padding:12px; border-radius:var(--radius-md); margin-bottom:20px; text-align:center;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Campus Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="student@campusfind.edu" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
                        <a href="/forgot-password.html" style="font-size:0.85rem; font-weight:600;">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:14px; font-size:1rem; margin-top:10px;">
                    Log In to CampusFind
                </button>
            </form>

            <div style="text-align:center; margin-top:24px; font-size:0.92rem; color:var(--text-muted);">
                Don't have an account yet? <a href="/register.html" style="font-weight:700;">Sign up here</a>
            </div>

            <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--lavender-border); font-size:0.82rem; color:var(--text-muted); text-align:center;">
                <strong>Test Accounts (Pre-Seeded):</strong><br>
                Admin: <code>admin@campusfind.edu</code> / <code>Admin@123</code><br>
                Student: <code>student@campusfind.edu</code> / <code>Student@123</code>
            </div>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('submit-btn');

            alertBox.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const res = await api.post('/api/auth/login', { email, password });
                if (res && res.success) {
                    api.showToast('Login successful! Redirecting...', 'success');
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect') || '/index.html';
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 600);
                } else {
                    throw new Error(res.message || 'Login failed');
                }
            } catch (err) {
                alertBox.textContent = err.message || 'Invalid email or password';
                alertBox.classList.add('visible');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In to CampusFind';
            }
        });
    </script>
</body>
</html>
